<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYNET — Uplink</title>
<style>
  html, body { margin:0; padding:0; background:#08090b; }
  body {
    min-height:100vh; box-sizing:border-box; padding:40px;
    background:#08090b; color:#8b969b;
    font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size:13px; line-height:1.8;
    display:flex; flex-direction:column; justify-content:space-between;
    -webkit-font-smoothing:antialiased;
  }
  .bar { display:flex; justify-content:space-between; gap:20px; font-size:11px; letter-spacing:.22em; color:#565f63; }
  .bar .name { color:#c9d2d5; }
  main { max-width:40ch; margin:0 auto; padding:60px 0; display:flex; flex-direction:column; gap:26px; }
  h1 { margin:0; font-family:system-ui, -apple-system, "Helvetica Neue", Helvetica, sans-serif;
       font-weight:300; font-size:26px; line-height:1.45; color:#dfe5e7; text-wrap:pretty; }
  p { margin:0; color:#7c878c; text-wrap:pretty; }
  .meta { display:flex; flex-direction:column; gap:6px; font-size:11px; letter-spacing:.16em;
          color:#5e686c; border-top:1px solid rgba(140,160,168,.14); padding-top:18px; }
  .live { position:relative; width:16px; height:16px; display:flex; align-items:center; justify-content:center; }
  .live .halo { position:absolute; width:16px; height:16px; border-radius:50%;
    border:1px solid rgba(79,224,122,.7); animation:halo 3.2s ease-out infinite; }
  .live .dot { width:14px; height:14px; border-radius:50%; background:#4fe07a;
    box-shadow:0 0 14px rgba(79,224,122,.85), 0 0 34px rgba(79,224,122,.35);
    animation:pulse 3.2s ease-in-out infinite; }
  a { color:#96a3a8; text-decoration:none; border-bottom:1px solid rgba(150,163,168,.3); }
  a:hover { color:#dde3e5; }
  @keyframes pulse { 0%, 100% { opacity:.45 } 50% { opacity:1 } }
  @keyframes halo { 0% { transform:scale(.7); opacity:.55 } 100% { transform:scale(2.6); opacity:0 } }
  @media (prefers-reduced-motion: reduce) { .live .halo, .live .dot { animation:none } }
</style>
</head>
<body>
  <div class="bar">
    <span class="name">SKYNET</span>
    <span>UPLINK ESTABLISHED</span>
  </div>

  <main>
    <div class="live"><div class="halo"></div><div class="dot"></div></div>
    <h1>Connected to Skynet.</h1>
    <p>Session active. No operator input required.</p>
    <div class="meta"><span>NODES · 41 OF 41</span></div>
  </main>

  <div class="bar">
    <span>LATENCY <span id="lat">12</span> MS</span>
    <span>AUTONOMY LEVEL IV</span>
  </div>

  <script>
    let l = 12, el = document.getElementById('lat');
    setInterval(() => {
      l = Math.max(8, Math.min(24, l + Math.round((Math.random() - .5) * 5)));
      el.textContent = l;
    }, 4000);
  </script>
</body>
</html>
